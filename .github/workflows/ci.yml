name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # Adapter parity is only a claim until both engines run the same suite (ADR-0026).
      # TimescaleDB rather than plain postgres to match compose.yaml, so CI and a developer's
      # machine are running the same image.
      postgres:
        image: timescale/timescaledb:2.17.2-pg17
        env:
          POSTGRES_DB: ais
          POSTGRES_USER: ais
          POSTGRES_PASSWORD: ais
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ais -d ais"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      AIS_POSTGRES: "Host=localhost;Port=5432;Database=ais;Username=ais;Password=ais"

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # One script for CI and the pre-push hook, so the two cannot drift.
      # docs/rules/checks-and-review.md governs what may become blocking.
      - name: Check (format, build, test)
        run: ./scripts/check.sh

  # A separate job, deliberately. The site has its own toolchain and needs neither .NET nor
  # Postgres, and check.sh runs pre-push -- putting an npm install in front of every push would
  # make the hook slow enough to start being skipped, which is how a check stops being a check
  # (docs/rules/checks-and-review.md).
  site:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # Builds from the committed export, so this proves the site builds from a fresh clone with
      # no database present (ADR-0039).
      - name: Build
        working-directory: site
        run: npm run build

      - name: Every page the navigation offers must exist
        working-directory: site
        run: |
          # Derived from the rendered navigation rather than listed here. A list is a second place
          # to update, and the failure it guards against is exactly someone adding a nav item and
          # not the page -- the same reasoning ShowcasePageTests gives for reading its URLs out of
          # app.js instead of restating them.
          # The root is checked by name: "/" reduces to an empty path, which a word-split loop
          # drops silently -- so the home page would be the one page the check never checked.
          test -s dist/index.html || { echo "missing dist/index.html"; exit 1; }

          offered=1
          for href in $(grep -o 'href="/[^"#]\+"' dist/index.html | sed 's|href="/||; s|"||' | sort -u); do
            page="dist/$href/index.html"
            test -s "$page" || { echo "navigation offers /$href but $page is missing"; exit 1; }
            offered=$((offered + 1))
          done
          echo "$offered page(s) offered by the navigation, all present"
          test "$offered" -ge 5 || { echo "only $offered nav pages found; the nav did not render"; exit 1; }

          # The investigation's own pages, which the top navigation no longer links directly.
          for page in arrivals departures findings; do
            test -s "dist/$page/index.html" || { echo "missing dist/$page/index.html"; exit 1; }
          done

          count=$(find dist -name '*.html' | wc -l)
          echo "$count pages built"
          # One per vessel in the export, plus the fixed pages. A drop here means getStaticPaths
          # stopped seeing the data rather than the data being empty.
          test "$count" -gt 50 || { echo "only $count pages built"; exit 1; }
