name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # Adapter parity is only a claim until both engines run the same suite (ADR-0026).
      # TimescaleDB rather than plain postgres to match compose.yaml, so CI and a developer's
      # machine are running the same image.
      postgres:
        image: timescale/timescaledb:2.17.2-pg17
        env:
          POSTGRES_DB: ais
          POSTGRES_USER: ais
          POSTGRES_PASSWORD: ais
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ais -d ais"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      AIS_POSTGRES: "Host=localhost;Port=5432;Database=ais;Username=ais;Password=ais"

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # One script for CI and the pre-push hook, so the two cannot drift.
      # docs/rules/checks-and-review.md governs what may become blocking.
      - name: Check (format, build, test)
        run: ./scripts/check.sh
