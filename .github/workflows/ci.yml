name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # One script for CI and the pre-push hook, so the two cannot drift.
      # docs/rules/checks-and-review.md governs what may become blocking.
      - name: Check (format, build, test)
        run: ./scripts/check.sh
